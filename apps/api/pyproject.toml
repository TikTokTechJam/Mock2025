[project]
name = "privastream-api"
version = "0.1.0"
description = "Control-plane API for the PrivaStream platform."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.139.2",
]

[project.optional-dependencies]
vision = [
    "easyocr>=1.7.2,<2",
    "opencv-python-headless>=4.10,<5",
    "ultralytics>=8.3,<9",
]
audio = [
    "faster-whisper==1.2.1",
    "silero-vad==6.2.1",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest>=8,<9",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["privastream_api"]
